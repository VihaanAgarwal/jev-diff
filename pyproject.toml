[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "jev-diff"
version = "0.1.0"
description = "Compare Jev decisions before changing a model, question, or threshold."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Vihaan Agarwal"}]
dependencies = []

[project.scripts]
jev-diff = "jev_diff.cli:main"

[project.urls]
Repository = "https://github.com/VihaanAgarwal/jev-diff"
Issues = "https://github.com/VihaanAgarwal/jev-diff/issues"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
