name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest ruff
      - run: pytest
      - run: ruff check .
      - run: jev-diff compare examples/baseline.jsonl examples/baseline.jsonl --policy examples/policy.json
